name: Cinema quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cinema/**"]

permissions:
  contents: read

concurrency:
  group: cinema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint entire repository
        run: bun run lint
      - name: Type-check application
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
      - name: Smoke-test Vite dev server and Cinema stylesheet
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/cinema-vite-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/cinema-dev-home.html; then
              break
            fi
            sleep 1
          done

          if [ ! -s /tmp/cinema-dev-home.html ]; then
            cat /tmp/cinema-vite-dev.log
            exit 1
          fi

          if ! curl --fail --silent 'http://127.0.0.1:4173/src/styles.css?direct' > /tmp/cinema-dev-styles.css; then
            cat /tmp/cinema-vite-dev.log
            exit 1
          fi

          grep -q 'cinema-app-shell' /tmp/cinema-dev-styles.css
