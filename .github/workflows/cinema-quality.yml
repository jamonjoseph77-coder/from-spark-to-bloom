name: Cinema quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cinema/**"]

permissions:
  contents: read

concurrency:
  group: cinema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed application files
        run: >-
          bunx eslint
          src/lib/tmdb.ts
          src/lib/tmdb.functions.ts
          src/lib/letterbox.ts
          src/lib/discoverEngagement.ts
          src/lib/profiles.ts
          src/lib/router.ts
          src/integrations/supabase/types.ts
          src/pages/DiscoverPage.tsx
          src/pages/HomePage.tsx
          src/pages/TmdbBrowsePage.tsx
          src/pages/TmdbDetailPage.tsx
          src/pages/FriendsPage.tsx
          src/pages/LetterboxPage.tsx
          src/components/tmdb/TmdbHero.tsx
          src/components/tmdb/TmdbCard.tsx
          src/components/discover/ContentEngagement.tsx
          src/components/discover/ClipCard.tsx
          src/components/social/SharedWithYou.tsx
          src/components/player/VideoPlayer.tsx
          src/components/ui/styles.ts
          src/contexts/AuthContext.tsx
          src/pages/AuthPage.tsx
          src/pages/ResetPasswordPage.tsx
          src/pages/TitlePage.tsx
          src/components/layout/navigation.ts
          src/components/layout/TopBar.tsx
          src/components/layout/NotificationBell.tsx
          src/components/social/CircleActivity.tsx
          src/components/social/FriendsHub.tsx
          src/pages/WatchPartiesPage.tsx
          src/lib/watchParties.ts
          src/components/ui/StatusViews.tsx
          src/pages/ComingSoonPage.tsx
          src/routes/__root.tsx
          src/components/layout/MobileNav.tsx
          src/pages/SearchPage.tsx
          src/routes/index.tsx
          src/components/tmdb/TmdbErrorState.tsx
          src/components/tmdb/TmdbSearchResults.tsx
          src/components/discover/DiscoverShorts.tsx
          src/components/discover/ShortCard.tsx
          src/components/discover/ShortViewer.tsx
          src/components/player/VideoPlayer.tsx
          src/pages/MyCinemaPage.tsx
          src/lib/error-capture.ts
          src/lib/error-page.ts
          src/server.ts
          src/components/discover/OfficialTrailers.tsx
          src/lib/clips.ts
          src/lib/media.ts
          src/pages/BrowsePage.tsx
          src/pages/SportsPage.tsx
          src/routes/sports.tsx
          src/components/ui/Artwork.tsx
          src/test/app-routing.test.tsx
          src/test/media.test.ts
          src/hooks/useAsyncData.ts
          src/lib/catalogue.ts
          --rule 'prettier/prettier: off'
      - name: Type-check application
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
      - name: Smoke-test Vite dev server and Cinema stylesheet
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/cinema-vite-dev.log 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/cinema-dev-home.html; then
              break
            fi
            sleep 1
          done

          if [ ! -s /tmp/cinema-dev-home.html ]; then
            cat /tmp/cinema-vite-dev.log
            exit 1
          fi

          if ! curl --fail --silent 'http://127.0.0.1:4173/src/styles.css?direct' > /tmp/cinema-dev-styles.css; then
            cat /tmp/cinema-vite-dev.log
            exit 1
          fi

          grep -q 'cinema-app-shell' /tmp/cinema-dev-styles.css
