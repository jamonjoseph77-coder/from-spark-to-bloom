name: Cinema quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cinema/**"]

permissions:
  contents: read

concurrency:
  group: cinema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed application files
        run: >-
          bunx eslint
          src/lib/tmdb.ts
          src/lib/tmdb.functions.ts
          src/lib/letterbox.ts
          src/lib/router.ts
          src/integrations/supabase/types.ts
          src/pages/DiscoverPage.tsx
          src/pages/HomePage.tsx
          src/pages/TmdbBrowsePage.tsx
          src/pages/TmdbDetailPage.tsx
          src/pages/FriendsPage.tsx
          src/pages/LetterboxPage.tsx
          src/components/tmdb/TmdbHero.tsx
          src/components/tmdb/TmdbCard.tsx
          src/components/player/VideoPlayer.tsx
          src/components/ui/styles.ts
          src/pages/TitlePage.tsx
          src/components/layout/navigation.ts
          src/components/layout/TopBar.tsx
          src/components/layout/NotificationBell.tsx
          src/components/social/CircleActivity.tsx
          src/components/social/FriendsHub.tsx
          src/pages/WatchPartiesPage.tsx
          src/lib/watchParties.ts
          src/components/ui/StatusViews.tsx
          src/pages/ComingSoonPage.tsx
          src/routes/__root.tsx
          src/components/layout/MobileNav.tsx
          src/pages/SearchPage.tsx
          src/routes/index.tsx
          src/components/tmdb/TmdbErrorState.tsx
          src/components/tmdb/TmdbSearchResults.tsx
          src/hooks/useAsyncData.ts
          src/lib/catalogue.ts
          --rule 'prettier/prettier: off'
      - name: Type-check application
        run: bunx tsc --noEmit
      - name: Run tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
