name: Cinema quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "cinema/**"]

permissions:
  contents: read

concurrency:
  group: cinema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Run tests
        run: bun run test
      - name: Build production bundle
        run: bun run build
